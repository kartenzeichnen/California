<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California Census Tracts Map</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f8f9fa;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            border: 1px solid #eeeeee;
        }

        .details {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #555;
            font-size: 0.95rem;
        }

        .source-link {
            color: #0066cc;
            text-decoration: none;
        }

        .source-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>California Geologic Faults</h1>
    
    <div class="container">
        <img src="Connor.png" alt="Connor">
        
        <div class="details">
            <p>Source: <a class="source-link" href="https://www.usgs.gov/media/images/map-known-active-geologic-faults-san-francisco-bay-region">USGS</a></p>
        </div>
    </div>

</body>
</html>
