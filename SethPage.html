<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>California County Map</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin: 0;
            padding: 40px 20px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .map-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 900px;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .caption {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <h1>California County Map</h1>
    
    <div class="map-card">
        <img src="https://geology.com/county-map/california-county-map.gif" alt="California County Map with County Seat Cities">
        
        <div class="caption">
            <p>Source: <a href="https://geology.com/county-map/california.shtml" target="_blank">Geology.com</a></p>
        </div>
    </div>

</body>
</html>
