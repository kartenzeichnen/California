<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>GES 3050 - California Earthquakes</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

    <link href="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.10.0/mapbox-gl.js"></script>

    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .legend {
            background-color: #fff;
            border-radius: 3px;
            bottom: 30px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
            padding: 15px;
            position: absolute;
            right: 10px;
            z-index: 1;
            line-height: 24px;
            color: #333;
        }

        .legend h4 { margin: 0 0 10px; font-size: 14px; }
        .legend div { display: flex; align-items: center; margin-bottom: 5px; font-size: 12px; }
        .legend span { border-radius: 50%; display: inline-block; margin-right: 10px; border: 1px solid #ccc; }

        .footer-source {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(255, 255, 255, 0.8);
            padding: 5px 10px;
            font-size: 12px;
            border-radius: 3px;
            z-index: 1;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <div class="legend">
        <h4>Earthquake Magnitude</h4>
        <div><span style="background:#fecc5c; width:10px; height:10px;"></span> M 4.4 – 4.69 (Light)</div>
        <div><span style="background:#fd8d3c; width:13px; height:13px;"></span> M 4.7 – 4.99 (Moderate)</div>
        <div><span style="background:#f03b20; width:16px; height:16px;"></span> M 5.0 – 5.49 (Strong)</div>
        <div><span style="background:#bd0026; width:19px; height:19px;"></span> M 5.5 – 7.0+ (Major)</div>
    </div>

    <div class="footer-source">
        <p><b>Data Source:</b> <a href="https://earthquake.usgs.gov/earthquakes/search/" target="_blank">USGS Earthquake Catalog</a></p>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1Ijoia2FydGVuemVpY2huZW4iLCJhIjoiY21tMHI1MDR0MDFueTJvbjZocDM3ejZieiJ9.G1QQK4LBG-VefDGlRUrokg';

        var map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/kartenzeichnen/cmm2cxq8o007b01suehnj5si1',
            center: [-119.0, 37.0],
            zoom: 5.6
        });

        map.on('load', function () {
            map.addLayer({
                'id': 'Earthquakes',
                'type': 'circle',
                'source': {
                    'type': 'vector',
                    'url': 'mapbox://kartenzeichnen.01ruxtc9'
                },
                'source-layer': 'Earthquakes-dn8qo8',
                'paint': {
                    'circle-color': [
                        'interpolate', ['linear'], ['get', 'mag'],
                        4.4, '#fecc5c',
                        4.7, '#fd8d3c',
                        5.0, '#f03b20',
                        5.5, '#bd0026'
                    ],
                    'circle-stroke-color': '#ffffff',
                    'circle-stroke-width': 1,
                    'circle-radius': [
                        'interpolate', ['linear'], ['zoom'],
                        5, ['interpolate', ['linear'], ['get', 'mag'], 4.4, 6, 7, 18],
                        10, ['interpolate', ['linear'], ['get', 'mag'], 4.4, 15, 7, 45]
                    ]
                }
            });

            // INTERACTIVITY: Click Event
            map.on('click', 'Earthquakes', (e) => {
                // Get features and coordinates
                const coordinates = e.features[0].geometry.coordinates.slice();
                const magnitude = e.features[0].properties.mag;
                const place = e.features[0].properties.place || "California";

                // Ensure the popup appears over the copy being pointed to if zoomed out
                while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                    coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                }

                // Create the popup
                new mapboxgl.Popup()
                    .setLngLat(coordinates)
                    .setHTML(`<strong>Magnitude: ${magnitude}</strong><br>Location: ${place}`)
                    .addTo(map);
            });

            // Change the cursor to a pointer when the mouse is over the earthquakes layer.
            map.on('mouseenter', 'Earthquakes', () => {
                map.getCanvas().style.cursor = 'pointer';
            });

            // Change it back to a pointer when it leaves.
            map.on('mouseleave', 'Earthquakes', () => {
                map.getCanvas().style.cursor = '';
            });
        });
    </script>

</body>
</html>
